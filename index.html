<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6edde" />
    <meta name="description" content="Visualizador 3D interactivo de un pipeline RISC-V RV32I de 5 etapas sobre una FPGA Nexys4 DDR." />
    <title>visual·RISCV — pipeline RV32I en 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318213d'/%3E%3Cpath d='M7 11h18M7 16h18M7 21h18' stroke='%231aa3a1' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%23f0a53a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () { var m = /[?&]wait=(\d+)/.exec(location.search); if (m) { var i = new Image(); i.src = 'http://localhost:5174/slow?' + m[1] + '&t=' + Date.now(); document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(i); i.style.display = 'none'; }); } })();
      if (/[?&]debug/.test(location.search)) {
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;z-index:9999;left:0;bottom:0;right:0;max-height:50vh;overflow:auto;margin:0;padding:8px;background:#000c;color:#ff9;font:12px monospace;white-space:pre-wrap';
        document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
        var log = function (t) { box.textContent += t + '\n'; };
        window.addEventListener('error', function (e) { log('ERR ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno); });
        window.addEventListener('unhandledrejection', function (e) { log('REJ ' + (e.reason && (e.reason.stack || e.reason))); });
        var ce = console.error, cw = console.warn;
        console.error = function () { log('console.error ' + [].slice.call(arguments).join(' ')); ce.apply(console, arguments); };
        console.warn = function () { log('console.warn ' + [].slice.call(arguments).join(' ').slice(0, 300)); cw.apply(console, arguments); };
      }
    </script>
    <noscript>Esta aplicación necesita JavaScript y WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
